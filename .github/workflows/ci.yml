name: pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.16.5"
  TFLINT_VERSION: "v0.64.0"
  TRIVY_VERSION: "v0.75.0"
  UV_VERSION: "0.12.23"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform fmt -check
        run: terraform fmt -recursive -check
      - uses: terraform-linters/setup-tflint@v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          for dir in bootstrap envs/prod; do
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact
          done

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform validate
        run: |
          for dir in bootstrap envs/prod; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Terraform misconfigurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "1"
      - name: Secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  database-permissions:
    name: Database permissions
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: energia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: energia
      ADMIN_USER: postgres
      ADMIN_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out energia-api (the schema the users have to work with)
        uses: actions/checkout@v7.0.1
        with:
          repository: LeonardoMatos07/energia-api
          ref: main
          path: energia-api
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: alembic upgrade head
        working-directory: energia-api
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/energia
        run: |
          uv sync --frozen
          uv run alembic upgrade head
      - name: Database users can write what they own and nothing else
        run: |
          command -v psql >/dev/null || sudo apt-get install -y --no-install-recommends postgresql-client
          bash scripts/db-permissions/check.sh

  plan:
    name: Plan
    needs: [lint, validate, security-scan, database-permissions]
    if: vars.TF_BACKEND_HCL != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - name: Write backend.hcl and terraform.tfvars
        env:
          TF_BACKEND_HCL: ${{ vars.TF_BACKEND_HCL }}
          TF_VARS_CONTENT: ${{ vars.TF_VARS }}
        run: |
          printf '%s\n' "$TF_BACKEND_HCL" > backend.hcl
          printf '%s\n' "$TF_VARS_CONTENT" > terraform.tfvars
      - name: terraform init
        run: terraform init -backend-config=backend.hcl
      - name: terraform plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          if [ "$code" -eq 1 ]; then exit 1; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### terraform plan (prod)"
            echo
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the plan for apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tfplan
          path: envs/prod/tfplan
          retention-days: 1
      - name: Comment the plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan-prod -->';
            let plan = fs.readFileSync('envs/prod/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) plan = '...(truncated)...\n' + plan.slice(-max);
            const summary = (plan.match(/^(Plan:.*|No changes.*)$/m) || ['plan output below'])[0];
            const body = `${marker}\n### terraform plan (prod): ${summary}\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n_Commit ${context.sha.substring(0, 7)}_`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  apply:
    name: Apply to production
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'sa-east-1' }}
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tfplan
          path: envs/prod
      - name: Write backend.hcl and terraform.tfvars
        env:
          TF_BACKEND_HCL: ${{ vars.TF_BACKEND_HCL }}
          TF_VARS_CONTENT: ${{ vars.TF_VARS }}
        run: |
          printf '%s\n' "$TF_BACKEND_HCL" > backend.hcl
          printf '%s\n' "$TF_VARS_CONTENT" > terraform.tfvars
      - name: terraform init
        run: terraform init -backend-config=backend.hcl
      - name: terraform apply (the reviewed plan)
        run: terraform apply -no-color tfplan
