version: 2
updates:
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /envs/prod
      - /modules/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      terraform:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
